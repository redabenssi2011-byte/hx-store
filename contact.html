<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  
  <div class="background">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
  </div>

  <nav>
    <div><strong>Contact Methods</strong></div>
    <div>
      <a href="rules.html">Home</a>
      <a href="index.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </nav>

  <div class="container">
    <div class="rules-section">
      <h2>🔍 Describe Your Problem</h2>
      <form class="contact-form">
        <label for="name">Your Discord Username:</label>
        <input type="text" id="name" placeholder="Enter your name" required />

        <label for="message">Problem:</label>
        <textarea id="message" rows="5" placeholder="Send all complaint details and if you have evidence, attach them as links via top4top.." required></textarea>

        <button type="submit">Send Your Complaint</button>
      </form>
    </div>
    <div class="toast-container"></div>
  </div>
<script src="script.js"></script>
</body>
</html>
