<!DOCTYPE html>
<html lang="eng" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>PRODUCT</title>
  <link rel="stylesheet" href="style.css">
  <script src="toast.js"></script>
</head>
<body>
  <div class="background">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
  </div>

  <nav>
    <Div><strong>PRODUCT</strong></div>
    <div>
      <a href="rules.html">HOME</a>
      <a href="index.html">PRODUCT</a>
      <a href="cart.html">CART</a>
      <a href="contact.html">SUPPORT</a>
    </div>
  </nav>
  <div class="container">
    <div class="product">
      <div class="product-image">
        <img src="https://timg.eu.cc/n8N5JbUeXZ.jpg" alt="PRODUCT 1">
      </div>
      <div class="product-info">
        <h3>LOGO/BANNER DESIGN </h3>
        <p>PRODUCT DATALIS</p>
        <div class="product-details">
          <span class="price"> 5M CREDIT</span>
          <span class="rating">⭐ PRODUCT RATE</span>
        </div>
        <button class="add-btn" onclick="addToCart('PRODUCT NAME', 5.00)">ADD TO CART  </button>
      </div>
    </div>
  </div>

  <script>
    function addToCart(name, price) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name, price });
      localStorage.setItem('cart', JSON.stringify(cart));
      window.location.href = 'cart.html';
    }
    
  </script>
</body>
</html>
