<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Order Confirmation</title>
  <link rel="stylesheet" href="style.css">
  <script src="toast.js"></script> 
</head>
<body>
  <div class="background">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
  </div>

  <nav>
    <h2>Order Confirmation</h2>
    <a href="cart.html">Back to Cart</a>
  </nav>

  <div class="container">
    <form class="contact-form" id="orderForm">
      <label>Customer Name</label>
      <input type="text" name="name" required placeholder="example: Moaaz Ahmed">

      <label>Discord Username</label>
      <input type="text" name="discord" required placeholder="example: 4w_9.">

      <label>Additional Details</label>
      <textarea name="details" rows="4" placeholder="example: I want it to be blue"></textarea>

      <div id="productDetails"></div>

      <button type="submit">Submit Order</button>
    </form>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const detailsDiv = document.getElementById('productDetails');

    if (cart.length === 0) {
      detailsDiv.innerHTML = "<p style='color: #aaa;'>No products in cart.</p>";
    } else {
      let html = "<h3>Products:</h3><ul>";
      cart.forEach(p => {
        html += `<li>${p.name} - ${p.price} EGP</li>`;
      });
      html += "</ul>";
      detailsDiv.innerHTML = html;
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = this.name.value;
      const discord = this.discord.value;
      const details = this.details.value;
      const orderId = Math.floor(100000 + Math.random() * 900000); // 6-digit random number

      let productsList = cart.map(p => `• ${p.name} - ${p.price} EGP`).join('\n');

      const webhookData = {
        embeds: [{
          title: `📦 New Order #${orderId}`,
          color: 3447003,
          fields: [
            { name: "👤 Name", value: name, inline: true },
            { name: "🕹️ Discord", value: discord, inline: true },
            { name: "🛒 Products", value: productsList || 'None', inline: false },
            { name: "📝 Additional Details", value: details || 'None', inline: false }
          ],
          footer: { text: "your server name - Order System" },
          timestamp: new Date().toISOString()
        }]
      };

      try {
        await fetch("https://discord.com/api/webhooks/1488861441409941664/lQzrRV74v5kPEDktuGIcN1phyh7YDruN0vvvIT_axY2B2PzeQ6I_9U-5g9UBw2wJU_Tq", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(webhookData)
        });

        showToast(`✅ Order submitted successfully! Your order number is: #${orderId}`, "success");

        localStorage.removeItem('cart');
        this.reset();

      } catch (err) {
        showToast("❌ Something went wrong", "error");
        console.error(err);
      }
    });
  </script>
</body>
</html>
